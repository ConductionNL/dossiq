description:
  en:
    shortDescription: >
      Case management with configurable workflows, deadlines and decisions.
    longDescription: >
      Dossiq brings structured case management to Nextcloud. Define case
      types, track progress through status lifecycles, manage deadlines and
      record formal decisions. Case types set the statuses, deadlines,
      required documents and extra fields each kind of case needs, and
      participants get a role on every case. Dutch government case work is
      supported with process templates, objections and appeals, disclosure
      requests and deadline monitoring. Dossiq stores its data in
      OpenRegister.
      Dossiq is available in the Nextcloud App Store at
      https://apps.nextcloud.com/apps/dossiq.
      Conduction maintains this component within the Nextcloud ISV programme.
    features:
      - Configurable case types with statuses, deadlines, documents and fields
      - Status lifecycle with a visual timeline and validation rules
      - Automatic deadlines with a countdown and an overdue alert
      - Tasks and formal decisions with their outcome
      - Participant roles for handler, advisor and decision maker
      - Document checklists per stage with upload verification
      - Sub-cases for breaking up a complex case
      - Eight confidentiality levels, defaulted from the case type
      - My Work dashboard with assigned cases and open tasks
      - Workflow board to move a case between statuses
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-cases.png
      - img/screenshot-admin.png

  nl:
    shortDescription: >
      Zaakafhandeling met configureerbare workflows, deadlines en besluiten.
    longDescription: >
      Dossiq brengt gestructureerde zaakafhandeling naar Nextcloud. Definieer
      zaaktypen, volg de voortgang via statuslifecycles, beheer deadlines en
      leg formele besluiten vast. Een zaaktype bepaalt de statussen,
      deadlines, verplichte documenten en extra velden die een zaak nodig
      heeft, en deelnemers krijgen een rol op elke zaak. Voor de Nederlandse
      overheid zijn er processjablonen, bezwaar en beroep, Woo-verzoeken en
      termijnbewaking. Dossiq slaat zijn gegevens op in OpenRegister.
      Dossiq is beschikbaar in de Nextcloud App Store op
      https://apps.nextcloud.com/apps/dossiq.
      Conduction onderhoudt dit component binnen het Nextcloud ISV-programma.
    features:
      - Configureerbare zaaktypen met statussen, deadlines, documenten en velden
      - Statuslifecycle met een visuele tijdlijn en validatieregels
      - Automatische deadlines met afteltelling en melding bij overschrijding
      - Taken en formele besluiten met hun uitkomst
      - Deelnemersrollen voor behandelaar, adviseur en beslisser
      - Documentchecklists per fase met uploadverificatie
      - Subzaken om een complexe zaak op te splitsen
      - Acht vertrouwelijkheidsniveaus, standaard vanuit het zaaktype
      - Mijn Werk-overzicht met toegewezen zaken en openstaande taken
      - Werkbord om een zaak tussen statussen te verplaatsen
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-cases.png
      - img/screenshot-admin.png

