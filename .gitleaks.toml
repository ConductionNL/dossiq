# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
]

[[allowlists]]
description = "Demo seed data: the key fields are human-readable slugs (for example veld-..., mijlpaal-...), not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lib/Settings/example\-sets/zuiddrecht\.json$''',
]

[[allowlists]]
description = "Seed data: seedKey is a human-readable slug, not a credential."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)lib/Settings/packages/vth/seed/inspection\-checklists\.json$''',
]

[[allowlists]]
description = "Specification examples: curl calls with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)openspec/changes/archive/2026\-03\-21\-base\-register\-seed\-data/specs/base\-register\-seed\-data/spec\.md$''',
  '''(^|/)openspec/changes/archive/2026\-03\-21\-mijn\-overheid\-integration/specs/mijn\-overheid\-integration/spec\.md$''',
  '''(^|/)openspec/changes/archive/2026\-05\-11\-base\-register\-seed\-data/specs/base\-register\-seed\-data/spec\.md$''',
  '''(^|/)openspec/changes/archive/2026\-05\-11\-mijn\-overheid\-integration/specs/mijn\-overheid\-integration/spec\.md$''',
  '''(^|/)openspec/changes/archive/2026\-06\-13\-archief\-edepot\-handover\-01\-schema\-config/tasks\.md$''',
  '''(^|/)openspec/changes/archive/2026\-06\-13\-dso\-omgevingsloket/specs/dso\-omgevingsloket/spec\.md$''',
  '''(^|/)openspec/changes/archive/2026\-06\-13\-open\-raadsinformatie/specs/open\-raadsinformatie/spec\.md$''',
]

[[allowlists]]
description = "Design prose: the phrase 'scoped API for tender status' matches the generic key pattern; there is no key in it."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)openspec/changes/archive/2026\-06\-13\-leverancier\-zaakportaal\-05\-tender\-backend/design\.md$''',
]

[[allowlists]]
description = "Test fixtures: a fixed UUID, a JWT assembled inside the test, and flow ids that look like keys; none is a credential."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/Unit/Controller/PortalWooRequestSubmissionKeyTest\.php$''',
  '''(^|/)tests/Unit/Service/ZgwServiceConsumerScopeTest\.php$''',
  '''(^|/)tests/vitest/caseTypeRulesAsRows\.spec\.js$''',
  '''(^|/)tests/vitest/rulesTabDutchWords\.spec\.js$''',
]
