openapi: 3.0.3
info:
  title: Procest ZGW Zaken API (ZRC)
  description: |
    Machine-readable description of the routed surface of Procest's ZGW
    Zaken Registratie Component (ZRC) API, generated from the app's route
    table (appinfo/routes.php). It documents paths, verbs and parameters
    only — payload semantics (request/response bodies, business rules)
    follow the VNG ZGW 1.x standard. See
    https://vng-realisatie.github.io/gemma-zaken/standaard/zaken/index
    for the authoritative resource schemas. Procest tracks the ZGW 1.x
    standard line.
  version: '1.0.0'
servers:
  - url: /apps/procest
    description: Procest app base path
components:
  securitySchemes:
    ZGWToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token issued to a registered ZGW consumer (applicatie).
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        invalidParams:
          type: array
          items:
            type: object
  responses:
    BadRequest:
      description: Bad Request — validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized — missing or invalid JWT bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden — consumer lacks the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - ZGWToken: []
paths:
  /api/zgw/zaken/v1/zaken/{zaakUuid}/zaakeigenschappen:
    get:
      operationId: zrc#zaakeigenschappenIndex
      summary: List zaakeigenschappen for a zaak.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: zrc#zaakeigenschappenCreate
      summary: Create a zaakeigenschap for a zaak.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/zaken/v1/zaken/{zaakUuid}/zaakeigenschappen/{uuid}:
    get:
      operationId: zrc#zaakeigenschappenShow
      summary: Show a specific zaakeigenschap.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: zrc#zaakeigenschappenUpdate
      summary: Update a zaakeigenschap.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: zrc#zaakeigenschappenPatch
      summary: Partially update a zaakeigenschap.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: zrc#zaakeigenschappenDestroy
      summary: Delete a zaakeigenschap.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/zaken/v1/zaken/{zaakUuid}/besluiten:
    get:
      operationId: zrc#zaakbesluitenIndex
      summary: List besluiten (zaakbesluiten) linked to a zaak.
      parameters:
        - name: zaakUuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/zaken/v1/zaken/_zoek:
    post:
      operationId: zrc#zoek
      summary: Search zaken. Delegates to the index handler and returns HTTP 201 per the ZGW standard.
      responses:
        '201': { description: Created (search results), content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/zgw/zaken/v1/{resource}/{uuid}/audittrail:
    get:
      operationId: zrc#audittrailIndex
      summary: List audit trail entries for a zaken resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/zaken/v1/{resource}/{uuid}/audittrail/{auditUuid}:
    get:
      operationId: zrc#audittrailShow
      summary: Retrieve a specific audit trail entry for a zaken resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
        - name: auditUuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/zaken/v1/{resource}:
    get:
      operationId: zrc#index
      summary: List resources of the given zaken type. For zaken, results are filtered by the consumer's vertrouwelijkheidaanduiding scope.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: zrc#create
      summary: Create a resource of the given zaken type.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/zgw/zaken/v1/{resource}/{uuid}:
    get:
      operationId: zrc#show
      summary: Retrieve a single resource of the given zaken type by UUID.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: zrc#update
      summary: Full update of a resource of the given zaken type.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: zrc#patch
      summary: Partial update of a resource of the given zaken type.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: zrc#destroy
      summary: Delete a resource of the given zaken type. For zaken, cascades to all sub-resources.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [zaken, statussen, resultaten, rollen, zaakeigenschappen, zaakinformatieobjecten, zaakobjecten, klantcontacten]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
