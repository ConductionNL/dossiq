openapi: 3.0.3
info:
  title: Dossiq ZGW Documenten API (DRC)
  description: |
    Machine-readable description of the routed surface of Dossiq's ZGW
    Documenten Registratie Component (DRC) API, generated from the app's
    route table (appinfo/routes.php). It documents paths, verbs and
    parameters only — payload semantics (request/response bodies, business
    rules) follow the VNG ZGW 1.x standard. See
    https://vng-realisatie.github.io/gemma-zaken/standaard/documenten/index
    for the authoritative resource schemas. Dossiq tracks the ZGW 1.x
    standard line.

    The `enkelvoudiginformatieobjecten/{uuid}/download` GET path is also
    registered by a second controller action (`zaakdossier#downloadZgwDocumenten`)
    for the same path and verb; both are documented once here as they are
    reachable through the same route.
  version: '1.0.0'
servers:
  - url: /apps/dossiq
    description: Dossiq app base path
components:
  securitySchemes:
    ZGWToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token issued to a registered ZGW consumer (applicatie).
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        invalidParams:
          type: array
          items:
            type: object
  responses:
    BadRequest:
      description: Bad Request — validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized — missing or invalid JWT bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden — consumer lacks the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - ZGWToken: []
paths:
  /api/zgw/documenten/v1/enkelvoudiginformatieobjecten/{uuid}/download:
    get:
      operationId: drc#download
      summary: Download the binary file content for an EIO document.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK — binary file content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/documenten/v1/enkelvoudiginformatieobjecten/{uuid}/lock:
    post:
      operationId: drc#lock
      summary: Lock an EIO document, generating a ZGW lock identifier.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/documenten/v1/enkelvoudiginformatieobjecten/{uuid}/unlock:
    post:
      operationId: drc#unlock
      summary: Unlock an EIO document. Requires a matching lock identifier, or the geforceerd-bijwerken scope.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/documenten/v1/bestandsdelen/{uuid}:
    put:
      operationId: drc#uploadChunk
      summary: Upload a chunk (bestandsdeel) for a document's chunked upload. Merges into the final file once all chunks are present.
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
        - name: volgnummer
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/documenten/v1/{resource}/{uuid}/audittrail:
    get:
      operationId: drc#audittrailIndex
      summary: List audit trail entries for a documenten resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/documenten/v1/{resource}/{uuid}/audittrail/{auditUuid}:
    get:
      operationId: drc#audittrailShow
      summary: Retrieve a specific audit trail entry for a documenten resource.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
        - name: auditUuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/zgw/documenten/v1/{resource}:
    get:
      operationId: drc#index
      summary: List resources of the given documenten type. objectinformatieobjecten and gebruiksrechten return a flat array per the ZGW standard.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: drc#create
      summary: Create a resource of the given documenten type. For enkelvoudiginformatieobjecten, accepts base64 file content (inhoud) or initiates a chunked upload.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/zgw/documenten/v1/{resource}/{uuid}:
    get:
      operationId: drc#show
      summary: Retrieve a single resource of the given documenten type by UUID.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: drc#update
      summary: Full update of a resource. For enkelvoudiginformatieobjecten, requires the document to be locked with a matching lock identifier.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: drc#patch
      summary: Partial update of a resource. For enkelvoudiginformatieobjecten, requires the document to be locked with a matching lock identifier.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: drc#destroy
      summary: Delete a resource of the given documenten type. For enkelvoudiginformatieobjecten, blocked while related objectinformatieobjecten exist and cascades gebruiksrechten deletion on success.
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [enkelvoudiginformatieobjecten, objectinformatieobjecten, gebruiksrechten, verzendingen]
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
