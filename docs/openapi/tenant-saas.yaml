openapi: 3.0.0
info:
  title: Dossiq Tenant SaaS API
  description: |
    Tenant SaaS chain (tenant-zaaksysteem-saas-01..12) endpoints: onboarding,
    configuration, quotas, billing. The tenant itself is an OpenRegister
    Organisation, created, listed and moved through OpenRegister's organisation
    endpoints, so the former tenant CRUD paths are gone. All endpoints are
    admin-only (#[AuthorizedAdminSetting]) unless documented otherwise.
  version: '0.1.0'
servers:
  - url: '/index.php/apps/dossiq'
    description: Dossiq app base path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
    OnboardingProgress:
      type: object
      properties:
        completed: { type: integer }
        total: { type: integer }
        fraction: { type: number, format: float }
        steps:
          type: array
          items:
            type: object
            properties:
              step: { type: string }
              status: { type: string, enum: [pending, in_progress, completed, skipped] }
              completedAt: { type: string, format: date-time, nullable: true }

security:
  - bearerAuth: []

paths:
  /api/saas/tenants/{tenantId}/onboarding/progress:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema: { type: string }
    get:
      summary: Onboarding progress (admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingProgress' }

  /api/saas/tenants/{tenantId}/onboarding/{step}/complete:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema: { type: string }
      - in: path
        name: step
        required: true
        schema: { type: string, enum: [contract, mandate_import, sso_setup, branding, zaaktype_selection, first_user, go_live] }
    post:
      summary: Mark an onboarding step complete (admin)
      responses:
        '200': { description: OK }
        '400': { description: Unknown step }
        '404': { description: Step row not found }
        '401': { description: Not authenticated }

  /api/saas/tenants/{tenantId}/onboarding/activate:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema: { type: string }
    post:
      summary: Validate go-live + transition to active (admin)
      responses:
        '200': { description: Activated }
        '409':
          description: Not ready — missing required pieces
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  result:
                    type: object
                    properties:
                      activated: { type: boolean }
                      missing:
                        type: array
                        items: { type: string }

  /api/saas/tenants/{tenantId}/onboarding/initialise:
    parameters:
      - in: path
        name: tenantId
        required: true
        schema: { type: string }
    post:
      summary: Fork the 7-step onboarding checklist for a tenant (admin)
      responses:
        '200': { description: OK }

# Standard cross-cutting error responses
# - 403 mandate denied, or the active organisation is not active
#       (both MandateValidationMiddleware)
# - 404 cross-tenant lookup (OpenRegister organisation row filter returns no row)
# - 429 request quota exceeded, answered by OpenRegister's TenantQuotaMiddleware
#       on OpenRegister's own routes. Dossiq's routes carry no request quota:
#       QuotaEnforcementMiddleware was retired when the request limit moved
#       onto Organisation.requestQuota, so that one limit is counted once.
