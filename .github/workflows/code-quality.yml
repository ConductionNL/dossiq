name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so it must cover the maximum
# any nested job declares: journeydoc-capture (contents+actions write),
# update-baseline / features-extract (contents write), and the Quality
# Report PR comment (issues / pull-requests write).
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: procest
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: false
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-coverage-guard: true
      # Newman disabled: ZGW compliance tests have 95%+ failure rate because
      # the ZGW API implementation is still in progress. Re-enable once the
      # API passes at least the core CRUD assertions.
      enable-newman: false
      newman-collection-path: "data"
      newman-environment-path: "tests/zgw/zgw-environment.json"
      newman-seed-command: "bash apps/procest/tests/zgw/seed-consumers.sh"
      additional-apps: '[{"repo":"Conduction/openregister","app":"openregister","ref":"feature/php-linting"}]'
      # SBOM disabled until @conduction/nextcloud-vue's dependency declarations
      # are cleaned up — its `npm ls` tree fails ELSPROBLEMS (bootstrap-vue is a
      # non-optional peer, apexcharts/pinia/vue version ranges don't match what
      # apps install, @types/react comes from a transitive rehype-react), which
      # @cyclonedx/cyclonedx-npm propagates as a hard failure (it always runs
      # `npm ls` under the hood; `--package-lock-only` doesn't sidestep it).
      # No other Conduction app enables SBOM today. Tracked in #434.
      enable-sbom: false
      # Playwright disabled until upstream @conduction/nextcloud-vue
      # CnObjectDataWidget bundling bug is fixed: the published bundle has a
      # hard-coded `require('../../store/index.js')` inside a soft try/catch
      # that webpack can't resolve in consumer apps, so the procest bundle
      # fails to build and every E2E spec then 404s. Tracked in
      # Conduction/nextcloud-vue#242 — re-enable once a beta past that fix
      # is pinned in package.json.
      enable-playwright: false
      enable-playwright-coverage: false
      playwright-coverage-threshold: 75
      playwright-seed-command: 'php occ maintenance:repair'
