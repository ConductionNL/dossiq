name: OpenSpec Sync

on:
  push:
    branches: [development]
    paths: ['openspec/**']
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: ConductionNL/.github/.github/workflows/openspec-sync.yml@main
    with:
      app-name: dossiq
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
